name: Publish npm package

# Publishes a workspace package when its release tag is pushed, using npm
# Trusted Publishing (GitHub OIDC). No npm token is stored anywhere.
# Tag format: <package-name>-v<version>, e.g. wp-native-client-v0.2.0
on:
  push:
    tags:
      - 'wp-native-client-v*'
      - 'wp-native-shell-v*'
      - 'wp-native-gutenberg-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. wp-native-client-v0.2.0)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve package from tag
        id: pkg
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          name="${TAG%-v*}"
          version="${TAG##*-v}"
          case "$name" in
            wp-native-client) dir=packages/api-client ;;
            wp-native-shell) dir=packages/shell ;;
            wp-native-gutenberg) dir=packages/gutenberg ;;
            *) echo "Unknown package in tag $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pkg.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          actual=$(node -p "require('./package.json').version")
          test "$actual" = "${{ steps.pkg.outputs.version }}" || { echo "package.json is $actual, tag says ${{ steps.pkg.outputs.version }}" >&2; exit 1; }

      - run: npm ci --no-audit --no-fund

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public --provenance
