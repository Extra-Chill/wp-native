name: Publish package

# On a release tag: builds the package, attaches the tarball to a GitHub release
# (consumers install from that URL; no npm account or human step needed), and
# also publishes to npm when the repo variable NPM_TRUSTED_PUBLISHING is 'true'
# (npm Trusted Publishing via GitHub OIDC; no token stored anywhere).
# Tag format: <package-name>-v<version>, e.g. wp-native-client-v0.2.0
on:
  push:
    tags:
      - 'wp-native-client-v*'
      - 'wp-native-shell-v*'
      - 'wp-native-gutenberg-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. wp-native-client-v0.2.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve package from tag
        id: pkg
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          name="${TAG%-v*}"
          version="${TAG##*-v}"
          case "$name" in
            wp-native-client) dir=packages/api-client ;;
            wp-native-shell) dir=packages/shell ;;
            wp-native-gutenberg) dir=packages/gutenberg ;;
            *) echo "Unknown package in tag $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pkg.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          actual=$(node -p "require('./package.json').version")
          test "$actual" = "${{ steps.pkg.outputs.version }}" || { echo "package.json is $actual, tag says ${{ steps.pkg.outputs.version }}" >&2; exit 1; }

      - run: npm ci --no-audit --no-fund

      - name: Clean build
        run: npx tsc -b --clean && npx tsc -b

      - name: Pack
        id: pack
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          file=$(npm pack --ignore-scripts --silent | tail -1)
          echo "file=${{ steps.pkg.outputs.dir }}/$file" >> "$GITHUB_OUTPUT"

      - name: Attach tarball to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Install: \`npm install https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename ${{ steps.pack.outputs.file }})\`"
          gh release upload "$TAG" "${{ steps.pack.outputs.file }}" --clobber

      - name: Publish to npm
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public --provenance --ignore-scripts
