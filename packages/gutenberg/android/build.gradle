plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.wpnative.gutenberg'
version = '0.1.0'

android {
  namespace 'org.wpnative.gutenberg'

  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'org.wordpress.gutenbergkit:android:v0.19.0'
}
